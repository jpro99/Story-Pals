name: story_pals
description: Story Pals - Kids educational adventure app for ages 2-8
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local storage (offline-first, no code-gen conflicts)
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^1.0.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Firebase (wired in Step 3 — stubs only for now)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # Animations
  lottie: ^3.1.2

  # Audio
  audioplayers: ^6.0.0
  flutter_tts: ^4.2.0
  record: ^6.2.0

  # In-app purchase (premium unlock)
  in_app_purchase: ^3.2.0

  # Utilities
  shared_preferences: ^2.3.1
  uuid: ^4.4.2
  intl: ^0.20.2
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
    - assets/content/chapters/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
